# ANDOR (Dragonfly) microscope configuration
# Used for merFISH experiments on the Andor Dragonfly spinning-disk confocal.
# Data is acquired in Imaris IMS format rather than individual TIFFs.

# File naming pattern for IMS files.
# Placeholders: {fov:03d} = zero-padded 3-digit field of view index
file_pattern: "*_F{fov:03d}.ims"

# Stage position extraction.
# Andor positions are embedded in the IMS file metadata; no separate position
# file is generated by default.
position_file_pattern: null
position_format: "ims"
stage_x_heading: null
stage_y_heading: null

# Experiment log file (may not be produced by all Andor acquisition setups)
log_file_name: "merfish_log.txt"

# Optical calibration
microns_per_pixel: 0.15078125
image_dimensions: [2048, 2048]

# Image orientation corrections applied during remapping
flip_horizontal: false
flip_vertical: false
transpose: false

# Default bead channel used for fiducial alignment
default_bead_channel: "488nm, Raw"

# Default MERlin parameter template files (found in templates/)
default_data_org_template: "XP8054_dataorganization.csv"
default_analysis_template: "ANDOR_Adaptive_analysis.json"
default_microscope_template: "ANDOR_microscope.json"

# NOTE: Andor-specific settings (channel_order, round_patterns) belong in
# the experiment config under raw_data.andor, not here. Example:
#   raw_data:
#     andor:
#       channel_order: [0, 2, 1]
